<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0c0c0c;color:#f1f1ee}
.w{position:relative;width:1200px;height:630px;padding:56px 64px;box-sizing:border-box}
.top{display:flex;justify-content:space-between;font:400 20px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:#8a8a85}

.st{position:absolute;right:70px;top:140px;width:170px;height:170px;border-radius:50%;background:#d4ff3f;color:#000;display:grid;place-items:center;font:600 64px 'Unbounded'}

</div></body></html>
